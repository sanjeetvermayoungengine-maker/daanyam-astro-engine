name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark smoke
        run: cargo bench --workspace --no-run

  docker-and-openapi:
    name: docker-and-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: daanyam-astro-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Regenerate OpenAPI artifact
        run: cargo run -p astro-api --bin write_openapi
      - name: Generate OpenAPI checksum
        run: sha256sum dist/openapi.json | tee dist/openapi.json.sha256
      - name: Check OpenAPI drift
        run: |
          jq -S . dist/openapi.json > /tmp/openapi.canonical.json
          git show HEAD:dist/openapi.json | jq -S . > /tmp/openapi.head.canonical.json
          diff -u /tmp/openapi.head.canonical.json /tmp/openapi.canonical.json
