name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ASTRO_EPHE_PATH: ./ephe/de440.bsp

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to Google Cloud
        if: ${{ vars.GCP_PROJECT_ID != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: ${{ vars.GCP_PROJECT_ID != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Fetch DE440 kernel
        if: ${{ vars.GCP_PROJECT_ID != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        run: |
          mkdir -p ./ephe
          gcloud storage cp gs://${{ vars.CLOUD_RUN_EPHEMERIS_BUCKET || 'daanyam-ephe' }}/de440.bsp "${ASTRO_EPHE_PATH}"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to Google Cloud
        if: ${{ vars.GCP_PROJECT_ID != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: ${{ vars.GCP_PROJECT_ID != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Fetch DE440 kernel
        if: ${{ vars.GCP_PROJECT_ID != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        run: |
          mkdir -p ./ephe
          gcloud storage cp gs://${{ vars.CLOUD_RUN_EPHEMERIS_BUCKET || 'daanyam-ephe' }}/de440.bsp "${ASTRO_EPHE_PATH}"
      - name: Benchmark smoke
        run: cargo bench --workspace --no-run

  docker-and-openapi:
    name: docker-and-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: daanyam-astro-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Regenerate OpenAPI artifact
        run: cargo run -p astro-api --bin write_openapi
      - name: Generate OpenAPI checksum
        run: sha256sum dist/openapi.json | tee dist/openapi.json.sha256
      - name: Check OpenAPI drift
        run: |
          jq -S . dist/openapi.json > /tmp/openapi.canonical.json
          git show HEAD:dist/openapi.json | jq -S . > /tmp/openapi.head.canonical.json
          diff -u /tmp/openapi.head.canonical.json /tmp/openapi.canonical.json
